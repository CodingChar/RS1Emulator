[package]
name = "ps1-web"
version = "0.1.0"
edition = "2021"

[dependencies]
ps1-wasm = { path = "../ps1-wasm" }
web-sys = { version = "0.3", features = [
    "Window", "Document", "HtmlCanvasElement", "CanvasRenderingContext2d",
    "ImageData", "Performance", "MouseEvent", "KeyboardEvent",
] }
wasm-bindgen = "0.2"

[[bin]]
name = "ps1-web"
path = "src/main.rs"
